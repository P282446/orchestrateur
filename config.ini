# =============================================================================
# Configuration de l'orchestrateur - À VERSIONNER dans le dépôt GitHub de l'orchestrateur
# Les pipelines sont clonés par le lanceur dans {pipelines}/<nom du dépôt>/ ; chaque script est
# retrouvé par son nom dans son dépôt (fonction trouver), quelle que soit l'arborescence. Les noms de
# dépôts utilisés ci-dessous doivent correspondre à la liste DEPOTS de lancer_entretiens.py
#
# Dans les commandes, on peut utiliser les variables suivantes (ne pas mettre de
# guillemets autour : les chemins sont protégés automatiquement) :
#   {entretien}  nom de l'entretien              {racine}     dossier de travail de l'entretien
#   {resultats}  dossier des résultats finaux    {pipelines}  dossier des dépôts GitHub clonés pour cette exécution
#   {python}     commande python                 {sortie}     dossier de sortie de l'étape en cours
#   {video_sujet} {video_psy} {fix_sujet} {fix_psy}           fichiers d'entrée de l'entretien
#   {video_transcription}                        vidéo choisie pour la transcription
#   Étapes "par regardeur" (portee = regardeur), exécutées pour sujet puis psy :
#   {regardeur}  sujet ou psy                    {video} {fix}  vidéo et fixations de ce regardeur
#   Résultat d'une étape précédente (fichier trouvé grâce à son motif "sortie") :
#   {segmentation}  {synchro_video_fichier}  {mesures_manquantes}   (ceux du regardeur courant)
#   {segmentation_psy}  {mesures_manquantes_sujet}  ...             (un regardeur précis)
#   {transcription}                              fichier de transcription
#   Dossiers : {dir_segmentation_sujet}  {dir_analyse}  ...
# Pour écrire une accolade littérale dans une commande : {{ et }}.
# Chaque ligne de "commandes" est une commande shell ; l'étape s'arrête à la première erreur.
# Environnement de chaque étape : environnement = venv | conda | aucun, avec requirements = <fichier>
# et/ou paquets = <liste> (le mot 'auto' = packages déduits des import des scripts du dossier
# 'sources' ; voir : python3 orchestrateur.py dependances <dossier>), version_python = 3.10 (conda). Il est créé une fois par lot, dans
# {pipelines}/.envs/<étape>, puis activé avant les commandes (python3 = celui de l'environnement).
# =============================================================================

[general]
# Dossier (sur le home Grid'5000, partagé entre frontend et noeuds) où sont créés
# un sous-dossier par entretien, avec résultats intermédiaires, journaux et état.
racine_travail = ~/travail_entretiens
python = python3
# Exécuté avant chaque étape (variables d'environnement, modules...). Les environnements Python
# sont créés automatiquement, un par pipeline (voir environnement = ... dans chaque étape).
# Où les créer : noeud (dans le job, avant la 1re utilisation) ou frontend (à la soumission,
# à choisir si les noeuds n'ont pas accès à Internet pour pip/conda).
installation_environnements = noeud
preparation = export HF_TOKEN=$(cat ~/.hf_token 2>/dev/null || true)
# Vidéo utilisée pour la transcription : sujet ou psy
video_transcription = sujet

[grid5000]
# Ressources demandées pour CHAQUE entretien (un job = un entretien)
ressources = host=1
walltime = 12:00:00
# Options oarsub supplémentaires, par ex. : -p "gpu_count>0"  ou  -t night  (voir la doc Grid'5000)
options_oar =
# Une nouvelle étape n'est pas lancée s'il reste moins de N minutes ; l'état est
# sauvegardé pour une reprise ultérieure.
marge_securite_min = 10

# -----------------------------------------------------------------------------
# 1. Segmentation des vidéos (sujet puis psy)
# -----------------------------------------------------------------------------
[segmentation]
portee = regardeur
sortie = seg_*
environnement = conda
version_python = 3.10
requirements = {pipelines}/segmentation/requirements.txt
commandes =
    app=$(trouver {pipelines}/segmentation app.py)
    cd "$(dirname "$app")"
    v={video}
    s={sortie}
    rm -rf "$s/tmp" "$s"/seg_*
    mkdir -p "$s/tmp"
    python3 app.py "$v" "$s/tmp"
    if [ "$(ls -1 "$s/tmp" | wc -l)" -ne 1 ]; then echo "app.py doit produire exactement 1 fichier, trouve :"; ls -1 "$s/tmp"; exit 1; fi
    mv "$s/tmp"/* "$s/seg_$(basename "$v")"
    rmdir "$s/tmp"

# -----------------------------------------------------------------------------
# 2. Synchronisation vidéo segmentée / fichier de fixations de l'eye-tracker
# -----------------------------------------------------------------------------
[synchro_video_fichier]
portee = regardeur
sortie = *_result_synchro.csv
environnement = venv
paquets = auto
sources = {pipelines}/synchronisation
commandes =
    script=$(trouver {pipelines}/synchronisation synchro_bis.py)
    cd "$(dirname "$script")"
    rm -f {sortie}/*_result_synchro.csv
    {python} synchro_bis.py {segmentation} {fix} -o {sortie}

# -----------------------------------------------------------------------------
# 3. Mesures manquantes (résultat de la synchro + vidéo d'origine)
# -----------------------------------------------------------------------------
[mesures_manquantes]
portee = regardeur
sortie = *.csv
environnement = venv
paquets = opencv-python<5 numpy pandas matplotlib
commandes =
    script=$(trouver {pipelines}/mesures_manquantes detect_head_pitch_v3.py)
    cd "$(dirname "$script")"
    v={video}
    src={synchro_video_fichier}
    s={sortie}
    rm -f "$s"/*.csv
    cp "$src" "$s/"
    f="$s/$(basename "$src")"
    {python} detect_head_pitch_v3.py "$v" "$f"
    res=$(ls -t "$s"/*.csv | head -n 1)
    if ! head -n 1 "$res" | grep -q type_absence; then echo "ERREUR : la colonne type_absence est absente de $res"; exit 1; fi

# -----------------------------------------------------------------------------
# 4. Transcription (une seule fois par entretien)
# -----------------------------------------------------------------------------
[transcription]
portee = entretien
sortie = transcription.csv
environnement = venv
paquets = auto
sources = {pipelines}/transcription
commandes =
    script=$(trouver {pipelines}/transcription transcription.py)
    cd "$(dirname "$script")"
    s={sortie}
    rm -f "$s/transcription.csv"
    ffmpeg -y -loglevel error -i {video_transcription} -vn -c:a pcm_s16le "$s/audio.wav"
    {python} transcription.py "$s/audio.wav" "$s/transcription.csv" --langue fr --noms SPEAKER_00=sujet SPEAKER_01=psy --modele large-v3
    find "$s" -mindepth 1 -maxdepth 1 ! -name transcription.csv -exec rm -rf {{}} +

# -----------------------------------------------------------------------------
# 5. Analyse : répartition des saccades, des fixations, synchro fixations/transcription
#    (utilise les trois scripts Python d'analyse ; les sorties finales vont dans {resultats})
# -----------------------------------------------------------------------------
[analyse]
portee = entretien
environnement = venv
paquets = pandas numpy matplotlib openpyxl
commandes =
    mkdir -p {dir_analyse}/sujet {dir_analyse}/psy {resultats}
    cp {mesures_manquantes_sujet} {dir_analyse}/sujet/mesures_sujet.csv
    cp {mesures_manquantes_psy} {dir_analyse}/psy/mesures_psy.csv
    sujet_py=$(trouver {pipelines}/analyse donnees_sujet.py)
    psy_py=$(trouver {pipelines}/analyse donnees_psy.py)
    trans_py=$(trouver {pipelines}/analyse ana_trans.py)
    {python} "$sujet_py" {dir_analyse}/sujet/mesures_sujet.csv
    {python} "$psy_py" {dir_analyse}/psy/mesures_psy.csv
    {python} "$trans_py" {dir_analyse}/psy/anv_psy.csv {dir_analyse}/sujet/anv_sujet.csv {transcription} --entretien {entretien} --sortie {resultats}
    cp {dir_analyse}/sujet/proportion_saccades.png {resultats}/repartition_saccades_sujet_{entretien}.png
    cp {dir_analyse}/psy/proportion_saccades.png {resultats}/repartition_saccades_psy_{entretien}.png
    cp {dir_analyse}/sujet/comparaison_zones_sujet.png {resultats}/repartition_fixations_sujet_{entretien}.png
    cp {dir_analyse}/psy/comparaison_zones_psy.png {resultats}/repartition_fixations_psy_{entretien}.png
    cp {dir_analyse}/sujet/anv_sujet.csv {resultats}/anv_sujet_{entretien}.csv
    cp {dir_analyse}/psy/anv_psy.csv {resultats}/anv_psy_{entretien}.csv
